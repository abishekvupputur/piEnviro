# /etc/systemd/journald.conf.d/ — keep the journal across reboots so a freeze leaves its last messages.
# (Debian's journald.conf sets Storage=volatile; this drop-in overrides it.)
[Journal]
Storage=persistent
SystemMaxUse=50M
# Flush to disk every 30 s instead of 5 min, so little is lost when the Pi hangs.
SyncIntervalSec=30s
