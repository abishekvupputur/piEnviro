# piEnviro: the sensor client (enviroMultiClient.py, host network) publishes here, and
# mqtt2status reads from here for status.vupputur.cc. Local only, so nothing on the LAN can publish.
listener 1883 127.0.0.1
allow_anonymous true

# Bridge to the homelab broker (EMQX on bigfootpi) whenever it is reachable; QoS 0, so nothing
# piles up while it is down. Our readings go out (for WeatherApp); the rack sensor's (PiAbi) come in,
# so mqtt2status can push them to status.vupputur.cc too.
connection homelab
address 192.168.8.111:1883
topic sensor/environment out 0
topic sensor/rack in 0
cleansession true
try_private false
notifications false
bridge_attempt_unsubscribe false
restart_timeout 30 600
