services:
  enviroplus:
    build: .
    container_name: piEnviro
    image: pienviro:0.2
    # Access to hardware interfaces
    devices:
      - /dev/i2c-1:/dev/i2c-1
      - /dev/spidev0.0:/dev/spidev0.0
      - /dev/spidev0.1:/dev/spidev0.1
      - /dev/gpiomem:/dev/gpiomem
      # If you have the PMS5003 particulate sensor, expose the UART used on your Pi:
      - /dev/ttyAMA0:/dev/ttyAMA0
      - /dev/snd:/dev/snd
      # On some models it may be /dev/ttyS0 instead:
      # - /dev/ttyS0:/dev/ttyS0
    # Simplest option to avoid permission hassles with GPIO/SPI/I2C
    privileged: true
    # Helpful if your example prints progress continuously
    tty: true
    restart: unless-stopped
    # Publishes to the Pi's own Mosquitto (127.0.0.1:1883), which forwards to the homelab broker
    # and feeds status.vupputur.cc (mqtt2status). Host network so 127.0.0.1 is the Pi itself.
    network_mode: host
    environment:
      MQTT_BROKER: 127.0.0.1
    # Mounted, so editing the script needs only a restart, not an image rebuild on the Pi.
    volumes:
      - ./examples/enviroMultiClient.py:/opt/enviroplus/examples/enviroMultiClient.py:ro
